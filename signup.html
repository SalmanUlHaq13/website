<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width,initial-scale=1" />
	<title>Sign Up — Salman</title>
	<link rel="stylesheet" href="signup.css">
</head>
<body>
	<main class="signup-page">
		<section class="hero">
			<div class="brand">
				<h1>Join Salman</h1>
				<p>Create your account — secure, fast, responsive.</p>
			</div>

			<form id="signupForm" class="signup-form" novalidate>
				<div class="form-grid">
					<div class="field">
						<input type="text" id="fullname" name="fullname" required />
						<label for="fullname">Full name</label>
						<span class="error" id="err-fullname"></span>
					</div>

					<div class="field">
						<input type="text" id="username" name="username" required pattern="^[a-zA-Z0-9._-]{3,}$" />
						<label for="username">Username</label>
						<span class="error" id="err-username"></span>
					</div>

					<div class="field">
						<input type="email" id="email" name="email" required />
						<label for="email">Email</label>
						<span class="error" id="err-email"></span>
					</div>

					<div class="field password-field">
						<input type="password" id="password" name="password" required minlength="8" />
						<label for="password">Password</label>
						<button type="button" class="toggle" data-target="password" aria-label="Show password">Show</button>
						<span class="error" id="err-password"></span>
						<div class="pw-meter" id="pw-meter">
							<div class="pw-bar"></div>
						</div>
						<small class="pw-text" id="pw-text">Use at least 8 characters, mix letters and numbers.</small>
					</div>

					<div class="field password-field">
						<input type="password" id="confirm" name="confirm" required />
						<label for="confirm">Confirm password</label>
						<button type="button" class="toggle" data-target="confirm" aria-label="Show password">Show</button>
						<span class="error" id="err-confirm"></span>
					</div>

					<div class="field">
						<input type="tel" id="phone" name="phone" pattern="^[0-9\-\+\s]{7,}$" />
						<label for="phone">Phone (optional)</label>
						<span class="error" id="err-phone"></span>
					</div>

					<div class="field file-field">
						<input type="file" id="avatar" name="avatar" accept="image/*" />
						<label for="avatar">Choose avatar (optional)</label>
						<div class="avatar-preview" id="avatarPreview" aria-hidden="true"></div>
						<span class="error" id="err-avatar"></span>
					</div>

					<div class="field full">
						<textarea id="bio" name="bio" rows="3" maxlength="300"></textarea>
						<label for="bio">Short bio (optional)</label>
						<small class="help">Max 300 characters</small>
					</div>
				</div>

				<div class="controls">
					<label class="terms">
						<input type="checkbox" id="agree" /> I agree to the <a href="#">terms</a>
					</label>
					<button id="submitBtn" type="submit" class="primary" disabled>Create account</button>
				</div>

				<div class="alt">
					<p>Already have an account? <a href="index.html">Sign in</a></p>
				</div>
			</form>
		</section>
	</main>

	<!-- success overlay -->
	<div id="successOverlay" class="overlay" hidden>
		<div class="overlay-card" role="dialog" aria-live="polite">
			<h2>Account created</h2>
			<p>Your account was created locally. This demo stores a summary in your browser storage only.</p>
			<button id="closeOverlay" class="primary">Continue</button>
		</div>
	</div>

	<script src="signup.js" defer></script>
</body>
</html>
